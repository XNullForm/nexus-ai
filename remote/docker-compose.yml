services:
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:latest
    container_name: nexus-remote
    restart: unless-stopped
    environment:
      HOSTNAME: ${NEXUS_REMOTE_HOSTNAME:-remote.example.com}
      PORT: 443
      REDIR_PORT: 80
      ALLOW_NEW_ACCOUNTS: "false"
      WEBRTC: "true"
      DYNAMIC_CONFIG: "false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config.json:/opt/meshcentral/meshcentral-data/config.json:ro
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      - meshcentral-web:/opt/meshcentral/meshcentral-web
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups

volumes:
  meshcentral-data:
  meshcentral-files:
  meshcentral-web:
  meshcentral-backups:
